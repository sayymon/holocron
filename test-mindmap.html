<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mindmap — Holocron</title>
  <style>
    html, body, svg { width: 100%; height: 100%; margin: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.2"></script>
</head>
<body>
<svg id="mindmap"></svg>
<script>
fetch('mindmap.md')
  .then(r => r.text())
  .then(md => {
    const { Transformer } = markmap;
    const { root } = new Transformer().transform(md);
    markmap.Markmap.create('#mindmap', { autoFit: true }, root);
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mindmap — Holocron</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0f172a; }
    svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
<svg id="m"></svg>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
<script>
const md = `# 🧠 Holocron

## Fundamentos
- IA
- ML
- DL

## Generative AI
- GPT-6
- Claude`;

const { Transformer } = window.markmap;
const { root } = new Transformer().transform(md);
markmap.Markmap.create('#m', { autoFit: true }, root);
</script>
</body>
</html>

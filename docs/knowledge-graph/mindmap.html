      position: fixed; top: 16px; left: 16px; z-index: 100;
      background: rgba(15,23,42,0.9); padding: 12px 20px;

    /* Legend */

      position: fixed; bottom: 16px; left: 16px; z-index: 100;
      background: rgba(15,23,42,0.9); padding: 12px 16px;
      border-radius: 12px; backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3); color: #fff;
      font-size: 12px;
    }
    #legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    #legend .dot { width: 10px; height: 10px; border-radius: 50%; }
    
    /* Stats */
    #stats {
      position: fixed; bottom: 16px; right: 16px; z-index: 100;
      background: rgba(15,23,42,0.9); padding: 12px 16px;
      border-radius: 12px; backdrop-filter: blur(10px);

    }

  </style>
</head>
<body>
  <div id="mindmap"></div>
  
  <div id="header">
    <h1>Holocron AI Engineer</h1>
    <p>Knowledge Graph — 65 docs atomicos</p>
  </div>
  
  <div id="toolbar">
    <button onclick="zoomIn()" title="Zoom In">+</button>
    <button onclick="zoomOut()" title="Zoom Out">-</button>
    <button onclick="resetView()" title="Reset">Reset</button>
    <button onclick="expandAll()" title="Expandir Tudo">Expandir</button>
    <button onclick="collapseAll()" title="Recolher Tudo">Recolher</button>
    <button onclick="toggleDark()" id="darkBtn" title="Dark/Light">🌙</button>
  </div>
  
  <div id="legend">
    <div class="item"><div class="dot" style="background:#3b82f6"></div> Conceitos</div>

  <div id="stats">

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <script>
    const markdown = `

    let mm;
    const { Markmap, loadCSS, loadJS } = window.markmap;
    
    // Cores por nivel
    const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];
    
    function init() {
      const { root } = markmap.Transformer.markmap(markdown);
      
      mm = Markmap.create('#mindmap', {
        colorFreezeLevel: 2,
        duration: 300,
        maxWidth: 300,
        paddingX: 16,
        spacingVertical: 8,
        spacingHorizontal: 80,
        autoFit: true,
        fitRatio: 0.92,
        zoom: true,
        pan: true,
        color: (node) => {
          const depth = node.state?.depth ?? 0;
          return colors[Math.min(depth, colors.length - 1)];
        }
      }, root);
    }

    function zoomIn() { mm?.rescale(1.3); }
    function zoomOut() { mm?.rescale(0.7); }
    function resetView() { mm?.fit(); }
    
    function expandAll() {
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mm.state.data);
      mm.renderData();
      mm.fit();
    }
    
    function collapseAll() {
      function collapse(node, depth = 0) {
        if (node.children && depth > 0) {
          node.payload = { ...node.payload, fold: 1 };
        }
        if (node.children) {
          node.children.forEach((c, i) => collapse(c, depth + 1));
        }
      }
      collapse(mm.state.data);
      mm.renderData();
      mm.fit();
    }
    
    let isDark = true;
    function toggleDark() {
      isDark = !isDark;
      document.body.style.background = isDark ? '#0f172a' : '#f8fafc';
      document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙';
    }

    // Init
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

    let mm;
    const { Markmap } = window.markmap;
    
    const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];
    
    function init() {
      document.getElementById('loading').style.display = 'none';
      
      const { root } = markmap.Transformer.markmap(markdown);
      
      mm = Markmap.create('#mindmap', {
        colorFreezeLevel: 2,
        duration: 300,
        maxWidth: 280,
        paddingX: 16,
        spacingVertical: 6,
        spacingHorizontal: 60,
        autoFit: true,
        fitRatio: 0.92,
        zoom: true,
        pan: true,
        color: (node) => {
          const depth = node.state?.depth ?? 0;
          return colors[Math.min(depth, colors.length - 1)];
        }
      }, root);
    }

    function zoomIn() { mm?.rescale(1.3); }
    function zoomOut() { mm?.rescale(0.7); }
    function resetView() { mm?.fit(); }
    
    function expandAll() {
      function expand(node) {
        if (node.children) {
          node.payload = { ...node.payload, fold: 0 };
          node.children.forEach(expand);
        }
      }
      expand(mm.state.data);
      mm.renderData();
      mm.fit();
    }
    
    function collapseAll() {
      function collapse(node, depth = 0) {
        if (node.children && depth > 0) {
          node.payload = { ...node.payload, fold: 1 };
        }
        if (node.children) {
          node.children.forEach((c) => collapse(c, depth + 1));
        }
      }
      collapse(mm.state.data);
      mm.renderData();
      mm.fit();
    }
    
    function regenerate() {
      location.reload();
    }

    document.addEventListener('DOMContentLoaded', init);
